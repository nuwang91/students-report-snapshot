<nav class="navigator">
  <div class="logo"></div>
  @if (hasLoggedInUser$ | async) {
    <button
      pButton
      pRipple
      type="button"
      class="p-button-text"
      (click)="logout()"
    >Logout</button>
  }
</nav>
<main class="main">
  @if (spinnerVisible$ | async) {
    <div class="overlay">
      <nugu-spinner></nugu-spinner>
    </div>
  }
  <router-outlet></router-outlet>
</main>
