<p-table [value]="dataSource" [rowTrackBy]="trackBy">
  <ng-template #header>
    <tr>
      @for (column of columns; track column.name) {
        <th [pSortableColumn]="column.name">
          {{ column.title }}
          <p-sort-icon [field]="column.name"></p-sort-icon>
        </th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-row>
    <tr>
      @for (column of columns; track column.name) {
        <td>
          @if (column.name === 'result') {
            <span [nuguResultColor]="row[column.name]">{{
              row[column.name]
            }}</span>
          } @else {
            {{ row[column.name] }}
          }
        </td>
      }
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    @if (!studentSelectedWithRange) {
      <tr>
        <td [attr.colspan]="columns.length">no data</td>
      </tr>
    } @else {
      <tr>
        <td [attr.colspan]="columns.length">
          {{ noDataMessageForStudent }}
        </td>
      </tr>
    }
  </ng-template>
</p-table>
